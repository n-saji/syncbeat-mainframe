spring.application.name=syncbeat-mainframe
#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#Postgres-local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/syncbeat}
spring.datasource.username=postgres
spring.datasource.password=postgres
#Server
server.port=${SERVER_PORT:8080}
#Auth
jwt.secret=${JWT_SECRET}
# Redis-local
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
#AWS
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:test}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:test}
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.endpoint=${AWS_ENDPOINT:http://localhost:4566}
#AWS S3
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:syncbeat-audio}
aws.s3.presigned-url-expiration=${AWS_S3_PRESIGNED_EXPIRATION:900}
#AWS CloudFront
cloudfront.domain-name=${CLOUDFRONT_DOMAIN_NAME:}
cloudfront.key-pair-id=${CLOUDFRONT_KEY_PAIR_ID:}
cloudfront.private-key-path=${CLOUDFRONT_PRIVATE_KEY_PATH:/app/keys/private_key.pem}
cloudfront.expiration-seconds=${CLOUDFRONT_EXPIRATION_SECONDS:3600}
