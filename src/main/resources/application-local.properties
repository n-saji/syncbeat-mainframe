# Active by default (spring.profiles.default=local in application.properties)
# whenever SPRING_PROFILES_ACTIVE isn't set -- i.e. local dev against
# LocalStack. Real deployments set SPRING_PROFILES_ACTIVE=prod, which skips
# this file entirely so the SDK uses real AWS endpoints + the EC2 instance role.
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:test}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:test}
spring.cloud.aws.endpoint=${AWS_ENDPOINT:http://localhost:4566}
