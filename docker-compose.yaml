version: "3.9"

services:
  localstack:
    image: localstack/localstack-pro:latest   # CloudFront/CloudFormation require the Pro image
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DEBUG: 1
      SERVICES: s3,sqs,sns,cloudformation,cloudfront
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      # AWS::CloudFront::PublicKey and AWS::CloudFront::KeyGroup have no
      # real resource provider in LocalStack Pro yet -- CFN currently
      # no-ops them with a warning, but that becomes a hard failure in
      # future releases unless this is set explicitly.
      CFN_IGNORE_UNSUPPORTED_RESOURCE_TYPES: 1
      # LocalStack's edge service has its own origin allowlist (a CSRF-style safety feature,
      # separate from and evaluated before any CloudFront/S3 CORS config) that 403s requests
      # from unrecognized Origins with a flat, bodyless response -- confirmed via curl this is
      # what was actually blocking the browser's cross-origin GET (CloudFront's own
      # ResponseHeadersPolicy CORS config, and the S3 bucket's CORS config, were both already
      # correct and had no effect on this). Needed for the frontend at localhost:3000 to
      # fetch/play signed audio URLs and PUT uploads at all.
      EXTRA_CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./localstack/init.sh:/etc/localstack/init/ready.d/init.sh
      - ./localstack/cloudformation:/etc/localstack/cloudformation
      - ./localstack/keys:/etc/localstack/keys
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: redis
    command: >
      redis-server
      --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  localstack-data:
  redis-data: